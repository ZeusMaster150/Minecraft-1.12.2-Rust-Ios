name: Check iOS Target

# Fast compile check for the iOS port. It runs before the release/IPA job would
# catch the same errors, and needs no MoltenVK download because the binary is
# only type-checked, not linked.
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IPHONEOS_DEPLOYMENT_TARGET: "12.0"
  CARGO_TERM_COLOR: always

jobs:
  check:
    # See ios-build.yml: macos-latest is the only label this account can acquire.
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add Rust iOS target
        run: rustup target add aarch64-apple-ios

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-check

      - name: cargo check for aarch64-apple-ios
        run: cargo check --target aarch64-apple-ios --bin mc112-client
